moneybot:
  target: dev
  outputs:
    # Local: gcloud auth application-default login. CI: the GitHub Actions service account.
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: moneybot_dev
      location: US
      threads: 1
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: moneybot
      location: US
      threads: 1
