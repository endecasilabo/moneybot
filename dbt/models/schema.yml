version: 2

models:
  - name: runs
    description: One row per bot execution.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: job
        description: trade or snapshot.
        data_tests: [not_null]
      - name: status
        description: running, ok, skipped, or error.
        data_tests: [not_null]

  - name: signals
    description: The decision recorded for one trade run.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('runs')
                field: id
      - name: symbol
        data_tests: [not_null]
      - name: action
        description: buy, sell, or hold.
        data_tests: [not_null]

  - name: orders
    description: A market-on-close order sent to Alpaca, keyed so a rerun cannot send it twice.
    columns:
      - name: client_order_id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('runs')
                field: id

  - name: account_snapshots
    description: Account balances and open orders at one snapshot run.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('runs')
                field: id
      - name: open_orders
        description: Open Alpaca orders stored as JSON.
        data_tests: [not_null]

  - name: position_snapshots
    description: One open position at one snapshot run.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('runs')
                field: id
      - name: symbol
        data_tests: [not_null]
