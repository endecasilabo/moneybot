version: 2

# Tables are append-only events; uniqueness is tested on the *_latest views, not the event tables.
models:
  - name: runs
    description: Run events. One row when a run starts (running) and one when it ends.
  - name: runs_latest
    description: Current state of each run.
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: status
        description: running, ok, skipped, or error.
        data_tests:
          - accepted_values:
              arguments:
                values: [running, ok, skipped, error]

  - name: signals
    description: What decide() saw and chose, with the strategy parameters that produced it.
    columns:
      - name: signal_id
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - relationships:
              arguments:
                to: ref('runs_latest')
                field: run_id
      - name: action
        description: buy, sell, or hold.
        data_tests:
          - accepted_values:
              arguments:
                values: [buy, sell, hold]

  - name: orders
    description: Order events sent to Alpaca. client_order_id repeats across events of one order.
  - name: orders_latest
    description: Current state of each order.
    columns:
      - name: client_order_id
        data_tests: [unique, not_null]

  - name: order_intents
    description: Intent events written by trigger and execute (next branch).
  - name: order_intents_latest
    description: Current state of each intent.
    columns:
      - name: client_order_id
        data_tests: [unique, not_null]

  - name: account_snapshots
    description: Account balances and open orders (JSON) at one snapshot run.
  - name: position_snapshots
    description: One open position at one snapshot run.
  - name: bars
    description: OHLCV bars by symbol, timeframe (1Hour, 1Day) and bar start ts (UTC).
  - name: assets
    description: Instrument dimension keyed by symbol.
