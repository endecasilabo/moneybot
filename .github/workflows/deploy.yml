# Runs unit tests on every push and PR. Deploys only from manual runs or pushes to main.
name: Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          uv venv --python 3.12
          uv pip install -r app/requirements.txt
          .venv/bin/python -m unittest discover -s tests

  deploy:
    name: Deploy
    # Skip PRs and non-main pushes. Manual runs always deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image and update Cloud Run jobs
        # Cloud Build pushes bot:latest, then updates any existing jobs to that image.
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          region="${REGION:-us-central1}"
          test -n "$PROJECT_ID" || { echo "PROJECT_ID is required"; exit 1; }
          gcloud builds submit --project "$PROJECT_ID" --config .github/cloudbuild.yml --substitutions "_REGION=${region}"
