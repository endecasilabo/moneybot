# Runs tests, then infra, then the image build. Tests also run on pull requests.
name: Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    secrets: inherit

  infra:
    name: Infra
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/infra.yml
    with:
      action: infra
    secrets: inherit

  build:
    name: Build
    needs: infra
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets: inherit
