# Infrastructure and secret operations. Deploy calls action infra before the image build.
name: Infra

on:
  workflow_call:
    inputs:
      action:
        description: infra, schema, secrets, or jobs.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: >-
          infra: create GCP resources (no jobs).
          schema: run dbt against BigQuery. Tables already exist after infra.
          secrets: load Alpaca keys into Secret Manager.
          jobs: create or update Cloud Run jobs and schedulers.
        required: true
        type: choice
        options:
          - infra
          - schema
          - secrets
          - jobs

# One infra run at a time. Never cancel a run mid-apply.
concurrency:
  group: moneybot-infra
  cancel-in-progress: false

jobs:
  run:
    name: Infra ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        if: inputs.action == 'infra' || inputs.action == 'jobs'
        uses: hashicorp/setup-terraform@v3

      - name: Set up uv
        if: inputs.action == 'schema'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Terraform init
        if: inputs.action == 'infra' || inputs.action == 'jobs'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          region="${REGION:-us-central1}"
          test -n "$PROJECT_ID" || { echo "PROJECT_ID is required"; exit 1; }
          state_bucket="${PROJECT_ID}-moneybot-tfstate"
          gcloud storage buckets describe "gs://${state_bucket}" --project "$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud storage buckets create "gs://${state_bucket}" --project "$PROJECT_ID" --location "$region" --uniform-bucket-level-access
          terraform -chdir=infra init -input=false -reconfigure \
            -backend-config="bucket=${state_bucket}" -backend-config="prefix=moneybot"

      - name: Terraform apply
        if: inputs.action == 'infra'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          region="${REGION:-us-central1}"
          # An empty image removes the jobs from the config, so Terraform would destroy them.
          # Once collector:latest exists, infra applies with it and keeps the jobs.
          image="${region}-docker.pkg.dev/${PROJECT_ID}/moneybot/collector:latest"
          if ! gcloud artifacts docker images describe "$image" --project "$PROJECT_ID" >/dev/null 2>&1; then
            image=""
          fi
          terraform -chdir=infra apply -input=false -auto-approve \
            -var="project_id=${PROJECT_ID}" -var="region=${region}" -var="image=${image}"

      - name: Terraform apply jobs
        if: inputs.action == 'jobs'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          region="${REGION:-us-central1}"
          image="${region}-docker.pkg.dev/${PROJECT_ID}/moneybot/collector:latest"
          terraform -chdir=infra apply -input=false -auto-approve \
            -var="project_id=${PROJECT_ID}" -var="region=${region}" -var="image=${image}"

      - name: Load Alpaca secrets
        if: inputs.action == 'secrets'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          test -n "$PROJECT_ID" || { echo "PROJECT_ID is required"; exit 1; }
          test -n "$ALPACA_KEY" && test -n "$ALPACA_SECRET" || { echo "ALPACA_KEY and ALPACA_SECRET must be set"; exit 1; }
          printf '%s' "$ALPACA_KEY" | gcloud secrets versions add moneybot-alpaca-key --project "$PROJECT_ID" --data-file=-
          printf '%s' "$ALPACA_SECRET" | gcloud secrets versions add moneybot-alpaca-secret --project "$PROJECT_ID" --data-file=-

      - name: dbt schema
        if: inputs.action == 'schema'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          region="${REGION:-us-central1}"
          test -n "$PROJECT_ID" || { echo "PROJECT_ID is required"; exit 1; }
          uv venv --python 3.12 dbt/.venv
          uv pip install --python dbt/.venv/bin/python -r dbt/requirements.txt
          REGION="$region" dbt/.venv/bin/dbt build --project-dir dbt --profiles-dir dbt
