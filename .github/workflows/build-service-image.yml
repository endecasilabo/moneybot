name: Build Service Image

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/.
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Tags are content hashes. A changed input is a new tag, so an existing tag is not rebuilt.
      # bedrock_sha is only the dependency inputs. image_sha is every file the allowlist lets in.
      # The context is the repo root, so both hashes read paths from there.
      - name: Hash service inputs
        id: hash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          dir="services/${SERVICE}"
          # Assign first. echo "$(...)" would hide a failing sha256sum.
          bedrock_sha="$(sha256sum "$dir/Dockerfile" "$dir/requirements.txt" "$dir/Dockerfile.dockerignore" | sha256sum | cut -d' ' -f1)"
          image_sha="$(find "$dir" config dbt/models/base -type f -exec sha256sum {} + | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          echo "bedrock_sha=${bedrock_sha}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${image_sha}" >> "$GITHUB_OUTPUT"

      # The app stage does FROM the published bedrock image, so bedrock has to be built with
      # --target bedrock. Without that flag Docker builds the app stage and the empty ARG fails.
      # Terraform points the jobs at :latest, so every run moves that tag to this image.
      - name: Build bedrock if missing, then the app image
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BEDROCK_SHA: ${{ steps.hash.outputs.bedrock_sha }}
          IMAGE_SHA: ${{ steps.hash.outputs.image_sha }}
        run: |
          set -euo pipefail
          test -n "$SERVICE"
          test -n "$PROJECT_ID"
          test -n "$BEDROCK_SHA"
          test -n "$IMAGE_SHA"
          # Repository name is google_artifact_registry_repository.bot in infra/main.tf.
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/moneybot"
          dockerfile="services/${SERVICE}/Dockerfile"
          bedrock_uri="${registry}/${SERVICE}-bedrock:${BEDROCK_SHA}"
          image_uri="${registry}/${SERVICE}:${IMAGE_SHA}"
          latest_uri="${registry}/${SERVICE}:latest"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          if gcloud artifacts docker images describe "$bedrock_uri" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "bedrock exists ${bedrock_uri}"
          else
            echo "building bedrock ${bedrock_uri}"
            docker build -f "$dockerfile" --target bedrock --tag "$bedrock_uri" .
            docker push "$bedrock_uri"
          fi

          if gcloud artifacts docker images describe "$image_uri" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "image exists ${image_uri}"
          else
            echo "building image ${image_uri} from ${bedrock_uri}"
            docker build -f "$dockerfile" \
              --build-arg "BEDROCK_IMAGE=${bedrock_uri}" \
              --tag "$image_uri" \
              .
            docker push "$image_uri"
          fi
          gcloud artifacts docker tags add "$image_uri" "$latest_uri" --quiet

          # A job pins the digest when it is created or updated, so moving :latest is not enough.
          # The update uses the content tag, so the image string always changes. The next infra
          # apply sets it back to :latest, which points at the same digest.
          for job in $(gcloud run jobs list --region "$REGION" --project "$PROJECT_ID" --format='value(metadata.name)'); do
            current="$(gcloud run jobs describe "$job" --region "$REGION" --project "$PROJECT_ID" \
              --format='value(spec.template.spec.template.spec.containers[0].image)')"
            case "$current" in
              "${registry}/${SERVICE}:"*|"${registry}/${SERVICE}@"*)
                echo "updating ${job} to ${image_uri}"
                gcloud run jobs update "$job" --image "$image_uri" --region "$REGION" --project "$PROJECT_ID" --quiet
                ;;
            esac
          done
