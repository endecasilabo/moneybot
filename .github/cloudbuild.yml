# One image per submit. The Build image workflow calls this twice:
#   bedrock — _TARGET=bedrock, _IMAGE_NAME={service}-bedrock, _IMAGE_TAG=<sha>
#   app     — _TARGET=app, _BEDROCK_IMAGE=<published bedrock uri>
substitutions:
  _REGION: us-central1
  _SERVICE: collector
  _IMAGE_NAME: collector
  _IMAGE_TAG: latest
  _TARGET: app
  _BEDROCK_IMAGE: bedrock

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
      - IMAGE_URI=${_REGION}-docker.pkg.dev/$PROJECT_ID/moneybot/${_IMAGE_NAME}:${_IMAGE_TAG}
      - TARGET=${_TARGET}
      - BEDROCK_IMAGE=${_BEDROCK_IMAGE}
      - SERVICE=${_SERVICE}
    args:
      - -ce
      - |
        set -euo pipefail
        context="services/$$SERVICE"
        dockerfile="$$context/Dockerfile"
        test -f "$$dockerfile"
        echo "IMAGE_URI=$$IMAGE_URI"
        echo "TARGET=$$TARGET"
        echo "BEDROCK_IMAGE=$$BEDROCK_IMAGE"
        if [ "$$TARGET" = bedrock ]; then
          docker build -f "$$dockerfile" --target bedrock --tag "$$IMAGE_URI" "$$context"
        else
          test -n "$$BEDROCK_IMAGE"
          docker build -f "$$dockerfile" \
            --build-arg "BEDROCK_IMAGE=$$BEDROCK_IMAGE" \
            --tag "$$IMAGE_URI" \
            "$$context"
        fi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/moneybot/${_IMAGE_NAME}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
